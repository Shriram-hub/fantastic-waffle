services:
  api:
    build: .
    env_file: .env
    environment:
      RUN_EMBEDDED_WORKER: "false"
      HOST: 0.0.0.0
      DATA_DIR: /app/data
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - orbit-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
  worker:
    build: .
    command: ["node", "server/worker.mjs"]
    env_file: .env
    environment:
      DATA_DIR: /app/data
      REDIS_URL: redis://redis:6379
    volumes:
      - orbit-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
volumes:
  orbit-data:
  redis-data:
